name: Refresh Mandela table

on:
  schedule:
    # 08:30 UTC = 11:30 MSK. Moscow does not observe DST, so this stays put when Europe changes clocks.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Yahoo and rebuild the page
        run: python scrape.py
      - name: Commit the new table
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update league table"
          file_pattern: index.html data.json
